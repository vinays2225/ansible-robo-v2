- name: Enable Maven 3.9 module stream
  ansible.builtin.dnf:
    name: "maven:3.9"
    state: present

- name: Install Maven, Java 25, and MySQL client
  ansible.builtin.dnf:
    name:
      - maven
      - maven-openjdk25
      - mysql
    state: present

- name: Install dependencies and package application
  ansible.builtin.command:
    cmd: mvn clean package
    chdir: /app

- name: Move and rename {{ component }} jar
  ansible.builtin.command:
    cmd: mv /app/target/{{ component }}.jar /app/{{ component }}.jar
    creates: /app/{{ component }}.jar
