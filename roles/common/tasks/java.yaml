- name: enable maven 3.9
  command: dnf module enable maven:3.9 -y

- name: install maven and java25
  dnf:
    name:
    - maven 
    - maven-openjdk25 # installing this so that we no need to set JAVA_HOME again
    - mysql
    state: present

- name: install dependencies
  command: mvn clean package
  args:
    chdir: /app

- name: Move and rename {{ component }} jar
  ansible.builtin.command:
    cmd: mv /app/target/{{ component }}.jar /app/{{ component }}.jar
  # Ensures the task only runs if the source file actually exists
  creates: /app/{{ component }}.jar 