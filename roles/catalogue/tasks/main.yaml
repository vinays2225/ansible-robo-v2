#App setup
- name: App Setup
  include_role:
    name: common
    tasks_from: app-setup.yaml
 

#nodejs setup
- name: install Node JS
  include_role:
    name: common
    tasks_from: nodejs.yaml


#Systemd service  
- name: Systemd setup
  include_role:
    name: common
    tasks_from: systemd-setup.yaml

- name: Copy mongo repo
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo  

- name: install mongodb client
  dnf:
    name: mongodb-mongosh
    state: present

- name: Check product count
  command:  mongosh --host "{{mongodb_host}}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'      
  register: product_count

- name: locad products
  shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
  when: product_count.stdout | int == 0

#start/restart sevice  
- name: Restart service
  include_role:
    name: common
    tasks_from: restart.yaml